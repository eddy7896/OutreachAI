name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Branch & PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Values from the event go through env, never straight into the shell script.
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/validate-branch.mjs "$BRANCH"
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs
      - name: PR targets main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$HEAD" in hotfix/*|release/*|dependabot/*|claude/*) exit 0 ;; esac
          if [ "$BASE" != "main" ]; then
            echo "PRs should target main (got $BASE). See docs/BRANCHING.md."
            exit 1
          fi

  quality:
    name: Typecheck, tests & checks
    # Editing a PR title or description only needs the conventions job.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: System checks (drift & contracts, fails on new errors)
        run: npm run check:system:ci
      - name: Lint budget (fails on new lint problems)
        run: npm run lint:budget

  build:
    name: Production build
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: next build
        run: npm run build
        env:
          # Placeholder until PR 0.2 makes the Resend client lazy; no real key is used at build time.
          RESEND_API_KEY: re_ci_placeholder
          NEXT_TELEMETRY_DISABLED: '1'
